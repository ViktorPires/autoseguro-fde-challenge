[project]
name = "autoseguro-agent"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1", "pyarrow>=19,<24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: tests against the real quote service"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
